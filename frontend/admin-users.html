<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Потребители — Админ — ФА Герман</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
  <script src="admin-auth.js"></script>
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="admin-header-inner">
      <span class="brand-mark">FA</span>
      <div><strong>ФА Герман — Админ</strong><small>Управление на достъпа</small></div>
    </div>
  </header>

  <nav class="admin-nav" aria-label="Админ навигация">
    <a href="admin-registrations.html">Записани за пробна тренировка</a>
    <a href="admin-news.html">Новини</a>
    <!-- „Потребители“ се добавя от admin-auth.js само за главния администратор -->
  </nav>

  <main class="admin-main">
    <div class="admin-toolbar">
      <div>
        <h1>Потребители</h1>
        <div id="adminStatus" class="admin-status">Зареждане...</div>
      </div>
    </div>

    <form id="newUserForm" class="user-form" autocomplete="off">
      <h2>Нов треньор</h2>
      <div class="user-form-row">
        <label>Потребителско име
          <input name="username" required autocapitalize="none" placeholder="напр. ivan.petrov">
        </label>
        <label>Име за показване
          <input name="display_name" placeholder="Иван Петров">
        </label>
        <label>Парола
          <span class="pw-row">
            <input name="password" required minlength="8" autocomplete="new-password">
            <button type="button" class="btn btn-ghost-dark" id="genBtn">Генерирай</button>
          </span>
        </label>
        <button class="btn btn-primary" type="submit">Създай</button>
      </div>
      <p class="user-hint">Паролата се вижда само сега — копирайте я и я дайте на треньора. По-късно можете само да зададете нова.</p>
      <div id="formStatus" class="admin-status" aria-live="polite"></div>
    </form>

    <div class="table-wrap">
      <table class="admin-table" id="usersTable" hidden>
        <thead>
          <tr>
            <th>Потребител</th><th>Име</th><th>Роля</th><th>Статус</th>
            <th>Последен вход</th><th>Действия</th>
          </tr>
        </thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
  </main>
  <script src="admin-users.js"></script>
</body>
</html>
