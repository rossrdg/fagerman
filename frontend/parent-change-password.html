<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Смяна на парола — ФА Герман</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="parent.css">
</head>
<body class="parent-body">
  <header class="parent-header">
    <span class="brand-mark">FA</span>
    <div class="who"><span id="who"></span><button id="logoutBtn" class="btn btn-ghost" type="button">Изход</button></div>
  </header>
  <main class="parent-main">
    <section class="parent-card parent-form">
      <h1 id="title">Смяна на парола</h1>
      <p id="lead" class="parent-lead"></p>
      <form id="pwForm" novalidate>
        <label>Текуща парола
          <input name="current" type="password" autocomplete="current-password" required>
          <div class="parent-field-error" data-error-for="current_password"></div>
        </label>
        <label>Нова парола (поне 8 символа)
          <input name="new" type="password" autocomplete="new-password" minlength="8" required>
          <div class="parent-field-error" data-error-for="new_password"></div>
        </label>
        <label>Повторете новата парола
          <input name="repeat" type="password" autocomplete="new-password" required>
          <div class="parent-field-error" data-error-for="repeat"></div>
        </label>
        <label id="consentRow" class="check" hidden>
          <input name="consent" type="checkbox">
          <span>Прочетох Политиката за поверителност и се съгласявам личните данни на мен и детето ми да се обработват за целите на картотекирането и участието в академията. <a href="/privacy" target="_blank" rel="noopener">Политика за поверителност</a></span>
        </label>
        <div class="parent-field-error" data-error-for="consent"></div>
        <button class="btn btn-primary btn-large" type="submit">Запази</button>
        <div id="pwStatus" class="parent-status" role="alert" aria-live="polite"></div>
      </form>
      <p id="backRow" class="muted" hidden><a href="/parent-portal.html" class="text-link">← Към портала</a></p>
    </section>
  </main>
  <script src="parent-common.js"></script>
  <script src="parent-change-password.js"></script>
</body>
</html>
