<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Вход — Админ — ФА Герман</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin-body login-body">
  <main class="login-card">
    <span class="brand-mark">FA</span>
    <h1>Вход в админ панела</h1>
    <form id="loginForm" novalidate>
      <label>Потребителско име
        <input name="username" autocomplete="username" autocapitalize="none" required autofocus>
      </label>
      <label>Парола
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <button class="btn btn-primary btn-large" type="submit">Вход</button>
      <div id="loginStatus" class="form-status error" role="alert" aria-live="polite"></div>
    </form>
  </main>
  <script src="admin-login.js"></script>
</body>
</html>
