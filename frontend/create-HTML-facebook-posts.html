<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Академията в действие</title>
<style>
  body{margin:0;font-family:Inter,system-ui,sans-serif;background:#fff;color:#111;padding:40px 24px}
  .wrap{max-width:1240px;margin:0 auto}
  .kicker{color:#0a66ff;font-weight:700;letter-spacing:.12em;font-size:13px}
  .title{font-size:clamp(32px,6vw,64px);font-weight:900;letter-spacing:-.02em;margin:12px 0 40px;line-height:.95}
  .title span.blue{color:#0a66ff}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid #eee;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06);display:flex;flex-direction:column}
  .card-head{height:110px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:36px;letter-spacing:.02em}
  .c1 .card-head{background:#1e3d2f} .c2 .card-head{background:#1f3a5a} .c3 .card-head{background:#1a3326}
  .card-body{padding:14px;display:flex;flex-direction:column;gap:12px}
  .label{color:#0a66ff;font-size:11px;font-weight:700;letter-spacing:.12em}
  .card iframe{width:100% !important;max-width:500px;border-radius:12px;margin:0 auto;display:block}
  .foot{padding:12px 16px;border-top:1px solid #f0f0f0}
  .foot b{font-size:18px;line-height:1.2;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">НОВИНИ & АКТИВНОСТ</div>
  <div class="title">Академията <span class="blue">в действие.</span></div>

  <div class="grid">
    <!-- BVB -->
    <div class="card c1">
      <div class="card-head">BVB</div>
      <div class="card-body">
        <div class="label">РАЗВИТИЕ</div>
        <iframe src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid02X1a9ZFabFNYDztvaWs8PBn2TUe7qw8TUDSDG7y4ciTn4HrNP4rWkp2R3UcsWCPZVl%26id%3D100087569690412&show_text=true&width=500" width="500" height="580" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
      </div>
      <div class="foot"><b>Стаж в Borussia Dortmund</b></div>
    </div>

    <!-- S04 -->
    <div class="card c2">
      <div class="card-head">S04</div>
      <div class="card-body">
        <div class="label">ОПИТ</div>
        <iframe src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid02X1a9ZFabFNYDztvaWs8PBn2TUe7qw8TUDSDG7y4ciTn4HrNP4rWkp2R3UcsWCPZVl%26id%3D100087569690412&show_text=true&width=500" width="500" height="580" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
      </div>
      <div class="foot"><b>Опит в Schalke 04</b></div>
    </div>

    <!-- FA -->
    <div class="card c3">
      <div class="card-head">FA</div>
      <div class="card-body">
        <div class="label">ОБЩНОСТ</div>
        <iframe src="https://www.facebook.com/plugins/post.php?href=https%3A%2F%2Fwww.facebook.com%2Fpermalink.php%3Fstory_fbid%3Dpfbid02X1a9ZFabFNYDztvaWs8PBn2TUe7qw8TUDSDG7y4ciTn4HrNP4rWkp2R3UcsWCPZVl%26id%3D100087569690412&show_text=true&width=500" width="500" height="580" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
      </div>
      <div class="foot"><b>Възобновяване на мъжкия отбор</b></div>
    </div>
  </div>
</div>
</body>
</html>
